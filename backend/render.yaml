services:
  - type: web
    name: securacam-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securacam-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*" # Update this to your Vercel URL after dashboard deployment
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: APP_BASE_URL
        sync: false
